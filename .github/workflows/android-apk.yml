name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar herramientas Android del runner
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "Usando $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar motor lógico
        run: node tests/engine.test.cjs
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Patinos-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK directo en GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.6-alpha"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" Patin-OS-v0.6-alpha-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Patin-OS-v0.6-alpha-debug.apk --clobber
          else
            gh release create "$TAG" Patin-OS-v0.6-alpha-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Patiñ Os v0.6 Alpha (APK Android)" \
              --notes "Versión alpha de prueba, 99 componentes, propiedades editables y motor eléctrico básico." \
              --prerelease
          fi
