name: Publicar APK firmado de Patiñ Os
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar firma de producción disponible
        env:
          KEYSTORE_BASE64: ${{ secrets.PATINOS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PATINOS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATINOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATINOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "::error::Falta PATINOS_KEYSTORE_BASE64"; exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Falta PATINOS_STORE_PASSWORD"; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Falta PATINOS_KEY_ALIAS"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Falta PATINOS_KEY_PASSWORD"; exit 1)
      - name: Instalar SDK Android
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Ejecutar regresiones
        run: |
          set -euo pipefail
          for file in tests/*.test.cjs; do node "$file"; done
      - name: Compilar APK de producción con firma persistente
        env:
          KEYSTORE_BASE64: ${{ secrets.PATINOS_KEYSTORE_BASE64 }}
          PATINOS_STORE_PASSWORD: ${{ secrets.PATINOS_STORE_PASSWORD }}
          PATINOS_KEY_ALIAS: ${{ secrets.PATINOS_KEY_ALIAS }}
          PATINOS_KEY_PASSWORD: ${{ secrets.PATINOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PATINOS_KEYSTORE_PATH="$RUNNER_TEMP/patinos-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$PATINOS_KEYSTORE_PATH"
          chmod 600 "$PATINOS_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Patin-OS-v0.9.6-release.apk
          rm -f "$PATINOS_KEYSTORE_PATH"
      - name: Publicar release firmada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -z "$(ls Patin-OS-v0.9.6-release.apk)"
          if gh release view v0.9.6 >/dev/null 2>&1; then
            echo "::error::La publicación v0.9.6 ya existe. Revisar manualmente antes de reemplazar una firma."
            exit 1
          fi
          gh release create v0.9.6 Patin-OS-v0.9.6-release.apk \
            --target "$GITHUB_SHA" \
            --title "Patiñ Os v0.9.6 — APK firmado" \
            --notes "APK firmado de producción. Exporta proyectos antes de migrar desde APKs debug: las firmas diferentes no permiten actualizar encima."
